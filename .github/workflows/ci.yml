name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh

  plist:
    name: Validate workflow XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check plist / wflow well-formedness
        run: |
          find claudeGhostty.workflow \( -name '*.plist' -o -name '*.wflow' \) -print0 \
            | while IFS= read -r -d '' f; do
                echo "Validating $f"
                xmllint --noout "$f"
              done

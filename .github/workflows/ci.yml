name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh

  plist:
    name: Validate workflow XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check plist / wflow well-formedness
        run: |
          for f in claudeGhostty.workflow/Contents/Info.plist \
                   claudeGhostty.workflow/Contents/document.wflow; do
            echo "Validating $f"
            python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$f"
          done
